<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday My Love 💙</title>
    <style>
        body {
            margin: 0;
            background: #0b3d91;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .cake {
            position: relative;
            width: 220px;
            height: 300px;
        }

        .layer {
            width: 220px;
            height: 50px;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            border-radius: 12px;
            position: absolute;
            left: 0;
            transform: translateY(-400px);
            opacity: 0;
        }

        .cream {
            width: 220px;
            height: 0;
            background: white;
            border-radius: 12px 12px 0 0;
            position: absolute;
            left: 0;
            transform: translateY(-400px);
            opacity: 0;
        }

        @keyframes drop {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes flowCream {
            from { height: 0; }
            to { height: 20px; }
        }

        .candle {
            width: 20px;
            height: 70px;
            background: red;
            position: absolute;
            left: 100px;
            top: -200px;
            border-radius: 5px;
            transition: 1s ease;
            opacity: 0;
        }

        .flame {
            width: 18px;
            height: 25px;
            background: radial-gradient(circle at 50% 60%, yellow, orange, red);
            border-radius: 50%;
            position: absolute;
            top: -25px;
            left: 1px;
            transform-origin: center bottom;
            animation: flicker 0.2s infinite alternate, sway 0.6s infinite ease-in-out;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.2) rotate(2deg); opacity: 1; }
        }

        @keyframes sway {
            0% { margin-left: -2px; }
            50% { margin-left: 2px; }
            100% { margin-left: -2px; }
        }

        @keyframes shakeCake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            50% { transform: translateX(3px); }
            75% { transform: translateX(-2px); }
            100% { transform: translateX(0); }
        }

        h1 {
            margin-top: 40px;
            opacity: 0;
            transition: 2s;
            text-shadow: 0 0 15px white;
        }
    </style>
</head>
<body>

<div class="cake" id="cake"></div>

<h1 id="message">🎉 Happy Birthday My Love 💙🎂</h1>

<script>
    const cake = document.getElementById("cake");
    const message = document.getElementById("message");

    let height = 0;

    function createLayer() {
        const layer = document.createElement("div");
        layer.className = "layer";
        layer.style.bottom = height + "px";
        cake.appendChild(layer);

        setTimeout(() => {
            layer.style.animation = "drop 0.8s ease forwards";
        }, 100);
    }

    function createCream() {
        const cream = document.createElement("div");
        cream.className = "cream";
        cream.style.bottom = (height + 50) + "px";
        cake.appendChild(cream);

        setTimeout(() => {
            cream.style.animation = "drop 0.8s ease forwards";
        }, 100);

        setTimeout(() => {
            cream.style.animation = "flowCream 1s forwards";
        }, 900);
    }

    function buildCake(times) {
        if (times === 0) {
            setTimeout(addCandle, 1200);
            return;
        }

        createLayer();
        setTimeout(() => {
            createCream();
            height += 70;
            setTimeout(() => buildCake(times - 1), 1600);
        }, 800);
    }

    function addCandle() {
        const candle = document.createElement("div");
        candle.className = "candle";
        cake.appendChild(candle);

        candle.style.opacity = 1;

        setTimeout(() => {
            candle.style.top = (-height - 60) + "px";
        }, 200);

        setTimeout(() => {
            const flame = document.createElement("div");
            flame.className = "flame";
            candle.appendChild(flame);

            candle.style.boxShadow = "0 0 20px red";

            cake.style.animation = "shakeCake 0.5s ease";
        }, 1200);

        setTimeout(() => {
            message.style.opacity = 1;
        }, 2200);
    }

    buildCake(3);
</script>

</body>

</html>
